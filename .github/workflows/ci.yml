name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        run: xcodebuild -scheme MacMode -configuration Debug -destination 'platform=macOS' build
      - name: Test
        run: xcodebuild test -scheme MacMode -destination 'platform=macOS'
